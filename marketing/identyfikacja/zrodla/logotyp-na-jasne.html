<!doctype html><html><head><meta charset="utf-8"><style>

*{margin:0;padding:0;box-sizing:border-box}
html,body{width:2000px;height:560px;overflow:hidden;background:transparent}
body{display:grid;place-items:center}

svg{height:150px;width:auto;flex:none;margin-left:34px;transform:translateY(68px)}
</style></head><body>

  <div class="wm">Lajf</div>
  <svg viewBox="45 36 50 33" xmlns="http://www.w3.org/2000/svg">

    <circle cx="86" cy="54" r="5.5" fill="#2f5fd0"/>
  </svg>

</body></html>
