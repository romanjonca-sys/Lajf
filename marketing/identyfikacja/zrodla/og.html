<!doctype html><html lang="pl"><head><meta charset="utf-8"><style>
@font-face{font-family:'Space Grotesk';src:url('space-grotesk-latin-wght-normal.woff2') format('woff2');font-weight:300 700}
@font-face{font-family:'Inter';src:url('inter-latin-wght-normal.woff2') format('woff2');font-weight:100 900}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden}
body{background:#070510;position:relative;padding:64px 68px;display:flex;flex-direction:column;justify-content:space-between;font-family:'Inter',sans-serif}
.poswiata{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5}
.p1{width:520px;height:520px;background:#2f5fd0;right:-120px;top:-160px}
.p2{width:420px;height:420px;background:#5b8cff;right:120px;bottom:-220px;opacity:.28}
.tresc{position:relative;z-index:1}
.logo{display:inline-flex;align-items:baseline;font-family:'Space Grotesk';font-weight:700;font-size:40px;letter-spacing:-.035em;color:#f4f1fb}
.logo svg{height:20px;width:auto;margin-left:6px;transform:translateY(9px)}
h1{font-family:'Space Grotesk';font-weight:700;font-size:82px;line-height:1.04;letter-spacing:-.035em;color:#f4f1fb;margin-top:76px;max-width:940px}
h1 span{color:#5b8cff}
.tagi{display:flex;gap:12px;margin-top:34px}
.tagi span{padding:11px 20px;border:1px solid rgba(255,255,255,.16);border-radius:999px;color:#c9c4dd;font-size:19px}
.stopka{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;color:#a8a2bd;font-size:19px}
.stopka b{color:#f4f1fb;font-weight:600}
</style></head><body>
<div class="poswiata p1"></div><div class="poswiata p2"></div>
<div class="tresc">
  <span class="logo">Lajf<svg viewBox="45 36 50 33"><path d="M50 54 h5 l5 -14 l6.5 25 l5 -11 h4" fill="none" stroke="#5b8cff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="86" cy="54" r="5.5" fill="#5b8cff"/></svg></span>
  <h1>Cyfrowa opieka<br>nad <span>Twoją firmą</span>.</h1>
  <div class="tagi"><span>Audyty cyfrowe</span><span>Technologia</span><span>Automatyzacje</span></div>
</div>
<div class="stopka"><b>lajf.eu</b><span>Roman Jońca · +48 880 133 640</span></div>
</body></html>
