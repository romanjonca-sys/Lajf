<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1080px;overflow:hidden}
body{font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;position:relative;background:#070510}
.bg{position:absolute;inset:0;background:linear-gradient(160deg,#0b1226 0%,#070510 55%,#0a0714 100%)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(91,140,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(91,140,255,.06) 1px,transparent 1px);background-size:60px 60px;mask-image:radial-gradient(120% 90% at 70% 15%,#000 30%,transparent 75%)}
.glow{position:absolute;top:-160px;right:-120px;width:640px;height:640px;border-radius:50%;background:radial-gradient(circle,rgba(41,105,241,.44)0%,rgba(41,105,241,0)64%)}
.top{position:absolute;top:52px;left:60px;display:flex;align-items:center;gap:16px}
.mark{width:52px;height:41px;position:relative}.mark .win{position:absolute;inset:0;border:4px solid #5b8cff;border-radius:9px}.mark .bar{position:absolute;top:12px;left:0;right:0;height:3px;background:#5b8cff}.mark .d{position:absolute;top:5px;width:6px;height:6px;border-radius:50%}.d1{left:7px;background:#ff7a59}.d2{left:18px;background:#3ce0b4}.d3{left:29px;background:#5b8cff}
.wm{font-size:38px;font-weight:800;letter-spacing:-.02em;color:#fff}
.eyebrow{position:absolute;top:150px;left:62px;font-family:ui-monospace,monospace;font-size:22px;letter-spacing:.2em;text-transform:uppercase;color:#3ce0b4}
.frame{position:absolute;top:230px;left:70px;right:70px;border-radius:20px;overflow:hidden;border:1px solid rgba(255,255,255,.12);box-shadow:0 40px 90px rgba(0,0,0,.55)}
.barz{height:56px;background:#141a2e;display:flex;align-items:center;padding:0 22px}
.cd{width:13px;height:13px;border-radius:50%;margin-right:9px}
.url{margin-left:16px;background:#0b0f1c;color:#8aa0c8;font-size:22px;padding:8px 22px;border-radius:8px;font-family:ui-monospace,monospace}
.frame img{display:block;width:100%;height:520px;object-fit:cover;object-position:top}
.label{position:absolute;left:70px;right:70px;bottom:78px;color:#fff}
.nm{font-size:64px;font-weight:800;letter-spacing:-.02em}
.tags{margin-top:18px;display:flex;gap:12px}
.tag{background:rgba(91,140,255,.16);color:#9dc0ff;border:1px solid rgba(91,140,255,.32);font-size:24px;font-weight:600;padding:10px 20px;border-radius:100px}
</style></head><body>
<div class="bg"></div><div class="grid"></div><div class="glow"></div>
<div class="top"><div class="mark"><div class="win"></div><div class="bar"></div><div class="d d1"></div><div class="d d2"></div><div class="d d3"></div></div><div class="wm">Lajf<span style="color:#5b8cff">.eu</span></div></div>
<div class="eyebrow">Realizacja</div>
<div class="frame">
  <div class="barz"><span class="cd" style="background:#ff5f57"></span><span class="cd" style="background:#febc2e"></span><span class="cd" style="background:#28c840"></span><span class="url">krzysztofstanio.pl</span></div>
  <img src="realizacje/stanio.png">
</div>
<div class="label">
  <div class="nm">Krzysztof Stanio</div>
  <div class="tags"><span class="tag">Strona</span><span class="tag">Rezerwacje</span><span class="tag">RODO</span></div>
</div>
</body></html>
