<!doctype html><html><head><meta charset="utf-8"><style>

.g .d{position:absolute;top:34px;width:24px;height:24px;border-radius:50%;background:#fff}
.d1{left:40px;opacity:.95}.d2{left:86px;opacity:.8}.d3{left:132px;opacity:.65}
.tx{position:relative;color:#fff;font-size:80px;font-weight:800;letter-spacing:-.01em;margin-top:64px}
.tx .e{opacity:.72}
</style></head><body>
<div class="bg"></div>
<div class="g"><div class="win"></div><div class="bar"></div><div class="d d1"></div><div class="d d2"></div><div class="d d3"></div></div>

</body></html>
