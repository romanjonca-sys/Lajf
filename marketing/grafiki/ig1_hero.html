<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1080px;overflow:hidden}
body{font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;position:relative;background:#070510}
.bg{position:absolute;inset:0;background:linear-gradient(160deg,#0b1226 0%,#070510 55%,#0a0714 100%)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(91,140,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(91,140,255,.06) 1px,transparent 1px);background-size:60px 60px;mask-image:radial-gradient(120% 90% at 70% 20%,#000 30%,transparent 75%)}
.glow{position:absolute;top:-160px;right:-120px;width:680px;height:680px;border-radius:50%;background:radial-gradient(circle,rgba(41,105,241,.5)0%,rgba(41,105,241,0)64%)}
.glow2{position:absolute;bottom:-180px;left:-160px;width:620px;height:620px;border-radius:50%;background:radial-gradient(circle,rgba(60,224,180,.22)0%,rgba(60,224,180,0)66%)}
.top{position:absolute;top:56px;left:60px;display:flex;align-items:center;gap:16px}
.mark{width:56px;height:44px;position:relative}
.mark .win{position:absolute;inset:0;border:4px solid #5b8cff;border-radius:9px}
.mark .bar{position:absolute;top:13px;left:0;right:0;height:3px;background:#5b8cff}
.mark .d{position:absolute;top:6px;width:6px;height:6px;border-radius:50%}
.d1{left:8px;background:#ff7a59}.d2{left:19px;background:#3ce0b4}.d3{left:30px;background:#5b8cff}
.wm{font-size:40px;font-weight:800;letter-spacing:-.02em;color:#fff}.wm .c{color:#5b8cff}
.body{position:absolute;left:60px;right:60px;bottom:72px;color:#fff}
.eyebrow{font-family:ui-monospace,monospace;font-size:22px;letter-spacing:.2em;text-transform:uppercase;color:#3ce0b4;margin-bottom:24px}
h1{font-size:82px;font-weight:800;letter-spacing:-.025em;line-height:1.04}
h1 .hl{color:#5b8cff}
.sub{font-size:29px;color:#c3ccdf;margin-top:26px;font-weight:500;line-height:1.4}
.pill{display:inline-flex;align-items:center;gap:12px;margin-top:34px;background:#2969f1;color:#fff;font-size:28px;font-weight:800;padding:20px 38px;border-radius:100px}
</style></head><body>
<div class="bg"></div><div class="grid"></div><div class="glow"></div><div class="glow2"></div>
<div class="top">
  <div class="mark"><div class="win"></div><div class="bar"></div><div class="d d1"></div><div class="d d2"></div><div class="d d3"></div></div>
  <div class="wm">Lajf</div>
</div>
<div class="body">
  <div class="eyebrow">Agencja stron dla firm</div>
  <h1>Strony, które <span class="hl">pracują</span> na klientów.</h1>
  <div class="sub">Szybkie · bezpieczne · pod konwersję. Projekt, wdrożenie i opieka — w jednym miejscu.</div>
  <div class="pill">Bezpłatna konsultacja · lajf.eu</div>
</div>
</body></html>
