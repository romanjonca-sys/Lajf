<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:900px;height:280px;overflow:hidden}
body{display:flex;align-items:center;justify-content:center;gap:26px;background:transparent;font-family:-apple-system,"Helvetica Neue",Arial,sans-serif}
.mk{width:96px;height:75px;position:relative;flex:none}
.mk .win{position:absolute;inset:0;border:6px solid #5b8cff;border-radius:15px}
.mk .bar{position:absolute;top:22px;left:0;right:0;height:5px;background:#5b8cff}
.mk .d{position:absolute;top:9px;width:10px;height:10px;border-radius:50%}
.d1{left:13px;background:#ff7a59}.d2{left:31px;background:#3ce0b4}.d3{left:49px;background:#5b8cff}
.wm{font-size:96px;font-weight:800;letter-spacing:-.02em;color:#fff;line-height:1}
.eu{color:#5b8cff}
</style></head><body>
<div class="mk"><div class="win"></div><div class="bar"></div><div class="d d1"></div><div class="d d2"></div><div class="d d3"></div></div>
<div class="wm">Lajf<span class="eu">.eu</span></div>
</body></html>
