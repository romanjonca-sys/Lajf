<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1080px;overflow:hidden}
body{font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;position:relative;background:#070510}
.bg{position:absolute;inset:0;background:linear-gradient(160deg,#0b1226 0%,#070510 55%,#0a0714 100%)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(91,140,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(91,140,255,.06) 1px,transparent 1px);background-size:60px 60px;mask-image:radial-gradient(120% 90% at 70% 15%,#000 30%,transparent 75%)}
.glow{position:absolute;top:-160px;right:-120px;width:680px;height:680px;border-radius:50%;background:radial-gradient(circle,rgba(41,105,241,.46)0%,rgba(41,105,241,0)64%)}
.top{position:absolute;top:56px;left:60px;display:flex;align-items:center;gap:16px}
.mark{width:56px;height:44px;position:relative}.mark .win{position:absolute;inset:0;border:4px solid #5b8cff;border-radius:9px}.mark .bar{position:absolute;top:13px;left:0;right:0;height:3px;background:#5b8cff}.mark .d{position:absolute;top:6px;width:6px;height:6px;border-radius:50%}.d1{left:8px;background:#ff7a59}.d2{left:19px;background:#3ce0b4}.d3{left:30px;background:#5b8cff}
.wm{font-size:40px;font-weight:800;letter-spacing:-.02em;color:#fff}
.body{position:absolute;left:60px;right:60px;top:300px;color:#fff}
.eyebrow{font-family:ui-monospace,monospace;font-size:22px;letter-spacing:.2em;text-transform:uppercase;color:#3ce0b4;margin-bottom:20px}
h1{font-size:66px;font-weight:800;letter-spacing:-.02em;line-height:1.03;margin-bottom:40px}
.step{display:flex;align-items:baseline;gap:24px;padding:22px 0;border-top:2px solid rgba(255,255,255,.12)}
.step .n{font-size:40px;font-weight:800;color:#5b8cff;flex:none;width:56px}
.step .t{font-size:42px;font-weight:700;color:#fff}
.step .s{font-size:26px;color:#93a0bd;margin-left:auto;font-weight:500}
</style></head><body>
<div class="bg"></div><div class="grid"></div><div class="glow"></div>
<div class="top"><div class="mark"><div class="win"></div><div class="bar"></div><div class="d d1"></div><div class="d d2"></div><div class="d d3"></div></div><div class="wm">Lajf<span style="color:#5b8cff">.eu</span></div></div>
<div class="body">
  <div class="eyebrow">Jak pracujemy</div>
  <h1>Od rozmowy do gotowej strony.</h1>
  <div class="step"><div class="n">01</div><div class="t">Rozmowa i cel</div><div class="s">bezpłatnie</div></div>
  <div class="step"><div class="n">02</div><div class="t">Projekt i treść</div><div class="s">akceptujesz</div></div>
  <div class="step"><div class="n">03</div><div class="t">Wdrożenie</div><div class="s">szybko</div></div>
  <div class="step"><div class="n">04</div><div class="t">Opieka i rozwój</div><div class="s">na bieżąco</div></div>
</div>
</body></html>
